plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.18.2'
    id 'maven-publish'
}

// the versions of Minecraft and of the mods built against depend on the Minecraft version that is built for
def versionFile = file("versions/${project.mc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("No versions/${project.mc}.properties, can't build for Minecraft ${project.mc}")
}
def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java {
            // what the mod and the server plugin both need: the protocol they talk in
            srcDir 'src/shared/java'
        }
    }
}

// one build gives everything: the mod and the server plugin
tasks.named('build') {
    dependsOn ':plugin:build'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "vrcamera" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    // Every Minecraft version runs in a folder of its own, a world that was opened in a newer one can't go back.
    // The version of gradle.properties keeps "run", the others asked for with -Pmc get "run-<version>"
    def usualVersion = new Properties()
    file("gradle.properties").withInputStream { usualVersion.load(it) }
    runs.configureEach {
        runDir = project.mc == usualVersion.mc ? "run" : "run-${project.mc}"
    }
}

// The classes that can't be the same for every Minecraft version: the game draws another way in each of them.
// "sources" in the file of a version names the folders of src/client it is built from, each "java-<name>" with
// the "resources-<name>" next to it: what all versions share, what a few of them share, and what is its own
def sourceNames = (project.findProperty("sources") ?: "shared,${project.mc}").split(",").collect { it.trim() }
sourceSets {
    client {
        java {
            srcDirs = sourceNames.collect { it == "shared" ? "src/client/java" : "src/client/java-${it}" }
        }
        resources {
            srcDirs = sourceNames.collect { it == "shared" ? "src/client/resources" : "src/client/resources-${it}" }
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Vivecraft, the mod this addon extends
    // The mod works without Vivecraft, for a player at a screen. -PnoVivecraft runs the game without it, to try that
    if (project.hasProperty("noVivecraft")) {
        modCompileOnly "maven.modrinth:vivecraft:${project.vivecraft_version}"
    } else {
        modImplementation "maven.modrinth:vivecraft:${project.vivecraft_version}"
    }

    // Optional, avatars of Figura can look into the camera. For the versions of the game Figura is not made for,
    // built against NoFigura, the Figura for those. -Pfigura runs the game with it
    def figura = "maven.modrinth:${project.findProperty("figura_project") ?: "figura"}:${project.figura_version}"
    if (project.hasProperty("figura")) {
        modImplementation figura
    } else {
        modCompileOnly figura
    }

    // optional, for the settings screen
    modImplementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
    // optional, to open the settings screen from the mod list. Not needed at runtime in the dev environment
    modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.compilerArgs += ["-Xmaxerrs", "2000"]
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// buildAll builds for every Minecraft version there is a file for in versions/, one after the other
def minecraftVersions = fileTree("versions").matching { include "*.properties" }.files
        .collect { it.name - ".properties" }.sort()
def versionBuilds = []
minecraftVersions.each { minecraftVersion ->
    def previous = versionBuilds.empty ? null : versionBuilds.last()
    versionBuilds << tasks.register("build_${minecraftVersion.replace('.', '_')}", GradleBuild) {
        group = "build"
        description = "Builds for Minecraft ${minecraftVersion}"
        buildName = "vrcamera-${minecraftVersion.replace('.', '-')}"
        tasks = ["build"]
        startParameter.projectProperties = [mc: minecraftVersion]
        if (previous != null) {
            mustRunAfter previous
        }
    }
}
tasks.register("buildAll") {
    group = "build"
    description = "Builds for every supported Minecraft version"
    dependsOn versionBuilds
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
