plugins {
    id 'net.fabricmc.fabric-loom' version '1.18.2'
    id 'maven-publish'
}

// the versions of Minecraft and of the mods built against depend on the Minecraft version that is built for
def versionFile = file("versions/${project.mc}.properties")
if (!versionFile.exists()) {
    throw new GradleException("No versions/${project.mc}.properties, can't build for Minecraft ${project.mc}")
}
def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }
versionProperties.each { key, value -> project.ext.set(key, value) }

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets {
    main {
        java {
            // what the mod and the server plugin both need: the protocol they talk in
            srcDir 'src/shared/java'
        }
    }
}

// one build gives everything: the mod and the server plugin
tasks.named('build') {
    dependsOn ':plugin:build'
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "vrcamera" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Vivecraft, the mod this addon extends
    implementation "maven.modrinth:vivecraft:${project.vivecraft_version}"

    // optional, for the settings screen
    implementation "maven.modrinth:cloth-config:${project.cloth_config_version}"
    // optional, to open the settings screen from the mod list. Not needed at runtime in the dev environment
    compileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// buildAll builds for every Minecraft version there is a file for in versions/, one after the other
def minecraftVersions = fileTree("versions").matching { include "*.properties" }.files
        .collect { it.name - ".properties" }.sort()
def versionBuilds = []
minecraftVersions.each { minecraftVersion ->
    def previous = versionBuilds.empty ? null : versionBuilds.last()
    versionBuilds << tasks.register("build_${minecraftVersion.replace('.', '_')}", GradleBuild) {
        group = "build"
        description = "Builds for Minecraft ${minecraftVersion}"
        buildName = "vrcamera-${minecraftVersion.replace('.', '-')}"
        tasks = ["build"]
        startParameter.projectProperties = [mc: minecraftVersion]
        if (previous != null) {
            mustRunAfter previous
        }
    }
}
tasks.register("buildAll") {
    group = "build"
    description = "Builds for every supported Minecraft version"
    dependsOn versionBuilds
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
    }
}
