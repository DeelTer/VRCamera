name: VRCamera
version: '${version}'
main: ru.deelter.vrcamera.sync.plugin.SyncPlugin
api-version: '1.21.4'
author: DeelTer
description: Lets players with the VRCamera mod see each other's pinned photos
commands:
  vrcamsync:
    description: Manage the pinned photos of the VRCamera mod
    usage: /vrcamsync <stats|list <player>|purge <player>|purgenear <blocks>|purgecustom|reload|camera <place|remove|clear|show|allow|deny> <player> [id] [seconds]>
    permission: vrcamera.admin
  vrcamphotos:
    description: List the photos you have pinned, and take them off
    usage: /vrcamphotos [page]
permissions:
  vrcamera.pin:
    description: Pin photos others can see
    default: true
  vrcamera.custom:
    description: Put up pictures loaded from the internet instead of photos
    default: true
  vrcamera.photo.nocooldown:
    description: Take photos without the wait of photos.cooldown-seconds
    default: op
  vrcamera.camera.unrestricted:
    description: Fly the free camera through blocks and as far as it goes
    default: op
  vrcamera.remove.others:
    description: Take off photos other players pinned
    default: op
  vrcamera.admin:
    description: Use /vrcamsync
    default: op
