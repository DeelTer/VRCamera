# VRCameraSync: pinned photos of the VRCamera mod, shared between the players that have it.

limits:
  # photos one player may have pinned at once, in all worlds
  per-player: 64
  # photos in one chunk, of all players together. Keeps a single spot from being plastered
  per-chunk: 24
  # photos on the whole server. Each takes about 10 KB on disk
  total: 20000
  # largest picture a client may send, in bytes. Never more than 24000
  image-bytes: 20000
  # Photos of one player that are not pinned: in a hand, falling, lying around. Only kept in memory, for the
  # others to see and pick up. Over this the oldest go. 0 keeps them to the player who made them
  loose-per-player: 8
  # minutes after which a photo that lies around untouched is gone
  loose-minutes: 10
  # milliseconds a player has to wait between two pins
  pin-cooldown-ms: 1500

photos:
  # Seconds a player has to wait between two photos. Their mod does not take one sooner, and the click of their
  # camera is not passed on to the others sooner. 0 for no wait. Players with the permission
  # vrcamera.photo.nocooldown (operators by default) never wait
  cooldown-seconds: 3

# Who may take a pinned photo off. false: the one who pinned it, and whoever has the permission
# vrcamera.remove.others (operators by default). true: everyone
anyone-takes-off: false

# Pictures that are not photos taken in the game, loaded by players with /vrcam load <url>. They are marked,
# and other players only see them if they turned that on in their mod. Needs the permission vrcamera.custom
# as well, which everyone has unless you take it away. false: nobody may
custom-pictures: true

# The worlds photos can be pinned and shared in, by the name of their folder.
#   mode: deny   everywhere but in the listed worlds. With an empty list: everywhere
#   mode: allow  only in the listed worlds
# Photos that hang in a world already stay there and can be taken off.
worlds:
  mode: deny
  list: [ ]
#  list:
#    - world
#    - world_nether

# true: a block with a photo pinned to it is not blown up, burned, pushed by a piston or decayed. A player can
# still break it, and the photo falls. Careful: it lets anyone make a block blast-proof and unmovable by
# pinning a photo to it
photos-protect-blocks: true

range:
  # blocks around a player in which photos are told to their client. Only a few bytes each, the picture itself
  # is asked for by the client when it comes closer
  send: 32
  # blocks after which the client is told to forget a photo again. Has to be more than send
  forget: 48

cameras:
  # players with the mod see the cameras of the others around them, moving, with the name of their owner
  share: true
  # blocks around a camera's owner in which it is shown
  range: 32
  # how many players at most are told where one camera is, the nearest ones. Keeps a crowd from flooding everyone
  max-watchers: 24

network:
  # pictures sent to one player per second. The channel is shared with everything else the server sends
  images-per-second: 4
  # picture requests of one player that may wait at once, more are dropped
  image-queue: 32
